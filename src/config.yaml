hyperparameters:
  batch_size: 32
  learning_rate: 0.001
  num_epochs: 10
  img_size: [256, 256]

data:
  classes: ["Benign", "InSitu", "Invasive", "Normal"]
  split: [0.8, 0.1, 0.1]
  normalisation:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

model:

execution:
  num_workers: 2

paths:
  img_dir: "data/ICIAR2018_BACH_Challenge/Photos"
  best_model_path: "results/best_model.pth"
  history_dir: "results/history"
